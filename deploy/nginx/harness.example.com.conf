# Insert both server blocks inside the existing nginx.conf http block.
# Reuse its connection_upgrade map, TLS defaults and Cloudflare allowlist.
server {
    listen 443 ssl;
    http2 on;
    server_name harness.example.com;

    # The existing certificate must cover harness.example.com.
    ssl_certificate /etc/nginx/ssl/harness.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/harness.example.com.key;
    ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull.ca.pem;
    ssl_verify_client on;
    include /etc/nginx/conf.d/cloudflare-ips.conf;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Nginx overwrites this header; only its loopback peer is trusted by DSH.
        proxy_set_header X-Hydrogen-Client-IP $http_cf_connecting_ip;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Login responses set their own no-store policy.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}

server {
    listen 80;
    server_name harness.example.com;
    return 301 https://harness.example.com$request_uri;
}
