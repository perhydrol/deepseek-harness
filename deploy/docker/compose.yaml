name: hydrogen-harness

services:
  harness:
    image: hydrogen-harness:local
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-}
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - home:/var/lib/dsh
      - workspace:/workspace
      - user-home:/home
      - type: bind
        source: ./auth.yml
        target: /etc/hydrogen-harness/auth.yml
        read_only: true
        bind:
          create_host_path: false
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

volumes:
  home:
  workspace:
  user-home:
